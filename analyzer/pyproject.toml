[project]
name = "buff-guardrails"
version = "0.1.0"
description = "Presidio recognizers for Russian/English PII, secrets and corporate dictionaries"
requires-python = ">=3.10"
license = { text = "MIT" }
dependencies = [
  "presidio-analyzer>=2.2",
  "pyyaml>=6",
]

[project.optional-dependencies]
hf = ["transformers>=4.40", "torch"]
gliner = ["gliner>=0.2"]
# the password judge of the secret cascade (bardsai/password-detector, int8 ONNX)
secrets = ["onnxruntime>=1.17", "huggingface_hub>=0.20", "numpy"]
test = ["pytest>=8"]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools]
packages = ["buff_guardrails"]

[tool.pytest.ini_options]
testpaths = ["tests"]

# LiteLLM proxy with the buff-guardrails PII guardrail.
# Model: a backend INSIDE your perimeter via LLM_MODEL / LLM_API_BASE / LLM_API_KEY in .env —
# ollama_chat/gemma3:4b (compose profile ollama), hosted_vllm/Qwen/Qwen3-8B (profile vllm),
# or openai/<name> for any OpenAI-compatible server you already run. Nothing leaves the network.
model_list:
  - model_name: default
    litellm_params:
      model: os.environ/LLM_MODEL
      api_key: os.environ/LLM_API_KEY
      api_base: os.environ/LLM_API_BASE
  # A model that needs no provider key: answers with a fixed text quoting the placeholders LiteLLM
  # creates for the sample in scripts/e2e_check.py (numbered left to right across all entities),
  # so the mask → restore path can be checked offline.
  - model_name: mock
    litellm_params:
      model: openai/mock
      api_key: mock
      # brackets deliberately mixed: models rewrite <X_1> as [X_1] / {X_1} / X_1, and all of them must come back
      mock_response: "Принято: [PERSON_1], <PHONE_NUMBER_2>, EMAIL_ADDRESS_3, {RU_SNILS_4}, (CREDIT_CARD_5)."

guardrails:
  - guardrail_name: pii-mask
    litellm_params:
      guardrail: presidio
      mode: pre_call            # mask the request before it leaves
      default_on: true          # applies to every key unless a key opts out
      output_parse_pii: true    # restore <PERSON_1> → original in the answer (incl. tool-call args)
      presidio_filter_scope: input  # scan the request only; the default "both" re-masks the restored answer
      presidio_language: auto   # our analyzer picks ru/en by script; override per request via guardrail_config.language
      presidio_score_thresholds:
        ALL: 0.35
  # Tolerant restore after the model: [PERSON_1], {PERSON_1}, PERSON_1 → original (litellm/fuzzy_unmask.py)
  - guardrail_name: pii-unmask-tolerant
    litellm_params:
      guardrail: fuzzy_unmask.FuzzyUnmask
      mode: post_call
      default_on: true

litellm_settings:
  drop_params: true
  set_verbose: false

general_settings:
  master_key: os.environ/LITELLM_MASTER_KEY
  database_url: os.environ/DATABASE_URL
  store_model_in_db: false
